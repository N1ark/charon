[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "charon-py"
version = "0.1.254"
description = "Python bindings for the (U)LLBC ASTs produced by Charon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[tool.setuptools.packages.find]
include = ["charon*"]
